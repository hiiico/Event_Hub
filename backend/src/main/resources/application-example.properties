# Application name
spring.application.name=EventHub Backend

# Server port
server.port=3000

# MongoDB Atlas Connection – use environment variables for credentials
spring.data.mongodb.uri=mongodb+srv://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@angular-workshop-cluste.d1dldux.mongodb.net/?appName=Angular-workshop-cluster
spring.data.mongodb.database=eventHub

# Logging
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.eventhub=DEBUG

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT – use environment variable for the secret (or keep a default)
jwt.secret=${JWT_SECRET:mySecretKeyForJWTGenerationShouldBeLongEnough12345}
jwt.expiration=86400000