# Application name
spring.application.name=EventHub Backend

# Server port
server.port=8080

# MongoDB Atlas Connection [citation:2][citation:5]
# Format: mongodb+srv://<username>:<password>@<cluster>.mongodb.net/<database>?retryWrites=true&w=majority
spring.data.mongodb.uri=mongodb+srv://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@angular-workshop-cluste.d1dldux.mongodb.net/?appName=Angular-workshop-cluster
spring.data.mongodb.database=eventHub

# Optional: Enable MongoDB transactions (requires replica set)
# spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.eventhub=DEBUG

# File upload (for event photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB