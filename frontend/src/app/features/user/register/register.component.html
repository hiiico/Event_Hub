<div class="form-card">
  <h2>Register</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="input-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="name" name="name" required>
    </div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" required minlength="6">
      @if (password.length > 0 && password.length < 6) {
        <div class="error">Password must be at least 6 characters</div>
      }
    </div>
    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" [(ngModel)]="rePassword" name="rePassword" required>
      @if (passwordMismatch) {
        <div class="error">Passwords do not match</div>
      }
    </div>
    @if (error) {
      <div class="error">{{ error }}</div>
    }
    <button type="submit" class="btn btn--accent"
            [disabled]="loading || passwordMismatch || (password.length > 0 && password.length < 6)">
      Sign up
    </button>
  </form>
  <p>Already have an account? <a routerLink="/login">Log in</a></p>
</div>
