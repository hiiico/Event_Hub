<div class="form-card">
  <h2>Register</h2>
  <form>
    <div class="input-group">
      <label>Name</label>
      <input type="text" name="name" required>
    </div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>

      <div class="error">Error</div>

    <button type="submit" class="btn btn--accent" style="width:100%; justify-content:center;">Sign up</button>
  </form>
  <p style="margin-top: 1rem;">Already have an account? <a routerLink="/login">Log in</a></p>
</div>
