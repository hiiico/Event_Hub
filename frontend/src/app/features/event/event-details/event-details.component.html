    </span>

    <span class="detail-meta__item">

      <!-- Show first 3 attendee avatars -->
<!--      @for (attendee of event.attendees | slice:0:3; track attendee.id) {-->

<!--      }-->
<!--      @if (event.attendeeCount > 3) {-->

<!--      }-->
    </div>
    <span>
      <i class="fas fa-user-check" style="color: var(--rsvp-green);"></i>
      <strong>event.attendeeCount  going</strong>
    </span>

    <button class="btn btn--rsvp">

        <i class="fas fa-check-circle"></i> Cancel RSVP

    </button>

  <!-- Comments section -->
  <div class="comment-section">
    <h3><i class="fas fa-comments"></i> Comments count</h3>
<!--    list of event comments-->
      <div class="comment">
<!--    comment author name-->
        <span class="avatar__circle">author name </span>
        <div class="comment__bubble">
          <strong>author name</strong>
          <p>comment text</p>
          <small>comment create dAt | date:'short' </small>
        </div>
      </div>
<!--    if empty -->
      <p>No comments yet. Be the first to comment!</p>

<!--    if isAuthenticated() -->
      <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;">
        <span class="avatar__circle" style="width:42px;">User name</span>
        <input
          type="text"
          placeholder="Write a comment..."
          style="flex:1 1 200px; border-radius: 3rem; border:1px solid var(--border-subtle); padding:0 1rem; min-width: 150px;"
        />
<!--    addComment()    -->
        <button class="btn btn--primary">Post</button>
      </div>
<!--  else -->
      <p><a href="/login">Log in</a> to leave a comment.</p>
