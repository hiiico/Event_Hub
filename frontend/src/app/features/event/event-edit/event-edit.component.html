@if (loading) {
  <div class="loading-spinner">Loading event...</div>
} @else if (error) {
  <div class="error-message">
    {{ error }} <a routerLink="/my-events">Back to my events</a>
  </div>
} @else {
  <h2>Edit Event</h2>
  <app-event-form
    [event]="event"
    buttonLabel="Save Changes"
    [loading]="saving"
    [error]="error"
    (submit)="onSubmit()"
  ></app-event-form>
<!--    <button type="button" class="btn btn&#45;&#45;accent" (click)="cancel()">Cancel</button>-->
}
