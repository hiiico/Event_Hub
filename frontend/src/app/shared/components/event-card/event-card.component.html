<div class="event-card" [class.event-card--manage]="showActions">
  <div class="event-card__image" style="background-color: #b0c4de;"></div>
  <div class="event-card__content">
    <div class="event-card__title">{{ event.title }}</div>
    <div class="event-card__detail">
      <i class="fas fa-calendar"></i> {{ event.dateTime | date:'mediumDate' }}
    </div>
    <div class="event-card__detail" [title]="event.location">
      <i class="fas fa-map-pin"></i> {{ event.location | shortenLocation }}
    </div>
    <div class="event-card__footer">
      <span><i class="fas fa-users"></i> {{ event.attendees?.length || 0 }} going</span>
      @if (showActions) {
        <div>
          <i class="fas fa-edit" (click)="onEdit()"></i>
          <i class="fas fa-trash-alt" (click)="onDelete()" style="margin-left:1rem; color:#c0392b;"></i>
        </div>
      } @else if (showRsvp) {
        <button class="btn btn--rsvp" (click)="onCancelRsvp()">Cancel RSVP</button>
      } @else {
        <a [routerLink]="['/events', event.id]" class="learn-more">Learn more →</a>
      }
    </div>
  </div>
</div>
