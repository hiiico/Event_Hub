<nav class="navbar">
  <div class="navbar__logo" routerLink="/">
    <i class="fas fa-calendar-check"></i> EventHub
  </div>
  <div class="navbar__menu">
    <a routerLink="/about" class="navbar__link">About</a>
    <a routerLink="/events" class="navbar__link">Events</a>
    @if (authService.isAuthenticated()) {
      <a routerLink="/my-events" class="navbar__link">My Events</a>
      <a routerLink="/profile" class="avatar">
        <span class="avatar__circle">{{ (authService.user$ | async)?.name?.charAt(0) || 'U' }}</span>
        <span>Profile</span>
      </a>
    } @else {
      <a routerLink="/login" class="navbar__link">Login</a>
      <a routerLink="/register" class="navbar__link">Register</a>
    }
  </div>
  <div class="navbar__cta">
    @if (authService.isAuthenticated()) {
      <button class="btn btn--accent" routerLink="/events/create">
        <i class="fas fa-plus-circle"></i> Create event
      </button>
      <button class="btn btn--outline" (click)="logout()">Logout</button>
    }
  </div>
</nav>
