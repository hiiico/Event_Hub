name: Deploy to Azure

on:
  push:
    branches: [ main ]

env:
  ACR_LOGIN_SERVER: eventhubhiiico.azurecr.io
  AZURE_WEBAPP_NAME: eventhub-backend

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.ACR_LOGIN_SERVER }}/eventhub-backend:${{ github.sha }} -t ${{ secrets.ACR_LOGIN_SERVER }}/eventhub-backend:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/eventhub-backend:latest

      - name: Deploy to Azure Web App (Container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/eventhub-backend:latest

  # Frontend: Azure Static Web App is already linked to GitHub (manual step)
  # No action needed here – it will build automatically on push.