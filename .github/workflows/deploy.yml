name: Deploy to Azure

on:
  push:
    branches: [ main ]

env:
  AZURE_WEBAPP_NAME: eventhub-backend
  AZURE_WEBAPP_PACKAGE_PATH: backend/target/*.jar
  JAVA_VERSION: '17'
  AZURE_STORAGE_ACCOUNT: eventhubfrontend

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Deploy JAR to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build Angular
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration=production
          ls -la dist/frontend/browser

      - name: Upload to Azure Storage static website
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            BUILD_PATH="./frontend/dist/frontend/browser"
            if [ ! -d "$BUILD_PATH" ]; then
              echo "ERROR: Build directory $BUILD_PATH not found!"
              exit 1
            fi
            az storage blob upload-batch \
              --account-name ${{ env.AZURE_STORAGE_ACCOUNT }} \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --source "$BUILD_PATH" \
              --destination '$web' \
              --overwrite