name: Deploy to Azure

on:
  push:
    branches: [ main ]

env:
  AZURE_WEBAPP_NAME: eventhub-backend
  AZURE_WEBAPP_PACKAGE_PATH: backend/target/*.jar
  JAVA_VERSION: '17'
  AZURE_STORAGE_ACCOUNT: eventhubfrontend

jobs:
  # ----------------------------------------------------------------------
  # Test job – runs all tests
  # ----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make test scripts executable
        run: |
          chmod +x backend/run-tests.sh
          chmod +x run-e2e-tests.sh

      - name: Run backend tests
        run: ./backend/run-tests.sh

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadless

      - name: Run E2E tests
        run: ./run-e2e-tests.sh

  # ----------------------------------------------------------------------
  # Backend deployment – only if all tests pass
  # ----------------------------------------------------------------------
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Deploy JAR to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Verify Backend Health
        run: |
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - Backend not ready yet, waiting 5 seconds..."
            sleep 5
          done
          echo "Backend did not become healthy in time."
          exit 1

  # ----------------------------------------------------------------------
  # Frontend deployment – only after backend deployment
  # ----------------------------------------------------------------------
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build Angular
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration=production
          ls -la dist/frontend/browser

      - name: Upload to Azure Storage static website
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            BUILD_PATH="./frontend/dist/frontend/browser"
            if [ ! -d "$BUILD_PATH" ]; then
              echo "ERROR: Build directory $BUILD_PATH not found!"
              exit 1
            fi
            az storage blob upload-batch \
              --account-name ${{ env.AZURE_STORAGE_ACCOUNT }} \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --source "$BUILD_PATH" \
              --destination '$web' \
              --overwrite